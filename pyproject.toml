[build-system]
requires = ['setuptools>=44.0.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'qtoolkit'
version = '0.1.0'
requires-python = '>=3.9'
authors = [
    {name = 'Faris Redza', email = 'faris.redza1999@gmail.com'}
]
maintainers = [
    {name = 'Faris Redza', email = 'faris.redza1999@gmail.com'}
]
readme = 'README.md'

dependencies = [
    'numpy>=2.0.0',
    'numba>=0.60.0'
]

[project.optional-dependencies]
dev = [
    'pytest>=5.1.0',
    'vermin>=0.2.2'
]
doc = ['sphinx']

[project.urls]
Homepage = 'https://github.com/FarisRedza/qtoolkit'
Repository = 'https://github.com/FarisRedza/qtoolkit.git'
